esphome:
  name: "levoit-air-purifier"
  friendly_name: "levoit-air-purifier"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y

external_components:
  - source: github://acvigue/esphome-levoit-purifier
    components: [levoit]

logger:
  baud_rate: 115200

# Enable Home Assistant API
api:
  encryption:
    key: "..."

ota:
  - platform: esphome
    password: "..."

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password

  ap:
    ssid: "Levoit-Core200S Fallback Hotspot"
    password: !secret ap_password

captive_portal:

uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

levoit:
  id: levoit1
  model: core200s
#  command_delay: 300 # default 300
#  command_timeout: 200 # default 200
#  status_poll_seconds: 0 # default 0, not needed if you get auto status msgs

fan:
  - platform: levoit
    name: "Levoit Purifier"

light:
  - platform: levoit
    name: "Nightlight"

# sensor:
#   Uptime sensor.
#  - platform: uptime
#    name: Uptime

#   WiFi Signal sensor.
#  - platform: wifi_signal
#    name: WiFi Signal
#    update_interval: 60s


switch:
  - platform: levoit
    display_lock:
      name: "Display Lock"
    display_on:
      name: "Display On"
    power:
      name: "Master Power"

button:
  - platform: levoit
    filter_reset:
      name: "Filter Reset"

# Optional select elements:
# * fan_mode is available via the fan entity
# * nightlight_mode is avaiable via the light entity
# select:
#   - platform: levoit
#     fan_mode:
#       name: "Fan Mode"
#     nightlight_mode:
#       name: "Nightlight Mode"

# Sub-MCU (Appliance Controller) Firmware Update Entity
# Specifically updates the secondary SinOne SC95F8616 MCU over UART (not the ESP32).
# ESPHome updates itself via standard ESPHome OTA.
update:
  - platform: levoit
    name: "Sub-MCU Appliance Firmware"
    # Example 1: Local Home Assistant www folder (http://homeassistant.local:8123/local/mcu_fw.bin)
    # source_url: "http://homeassistant.local:8123/local/mcu_fw.bin"
    #
    # Example 2: GitHub repository release / raw asset
    # source_url: "https://raw.githubusercontent.com/arcsur/esphome-levoit-air-purifier/main/firmware/mcu_fw.bin"
    #
    # Set latest_version higher than current to display the "Update Available" badge in Home Assistant:
    # latest_version: "2.0.11"
